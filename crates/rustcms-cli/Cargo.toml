[package]
name = "rustcms-cli"
description = "The `rustcms` command: create apps, generate code, run app commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

build = "build.rs"

[[bin]]
name = "rustcms"
path = "src/main.rs"
doc = false

[dependencies]
rustcms-core.workspace = true
rustcms-auth.workspace = true
rustcms-admin.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
include_dir.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
semver.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# Signals to the process groups of `serve --watch` (no `unsafe`); already in Cargo.lock.
nix = { version = "=0.31.3", features = ["signal"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates = "3"

[lints]
workspace = true
